## Force Bluetooth headsets (AirPods) to high-quality A2DP only.
## HFP/HSP (the low-quality "Handsfree Head Unit" call profile) is disabled entirely.
monitor.bluez.properties = {
  ## Turn off the HFP/HSP backend completely -> no Handsfree profile is ever offered.
  bluez5.hfphsp-backend = "none"

  ## Only advertise the A2DP audio roles; drop the headset roles.
  bluez5.roles = [ a2dp_sink a2dp_source ]

  ## Belt-and-suspenders: never auto-switch profiles for a mic.
  bluez5.autoswitch-profile = false
}
