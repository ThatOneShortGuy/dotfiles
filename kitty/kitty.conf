confirm_os_window_close 0

background_opacity 0.85

map ctrl+shift+h null
map ctrl+shift+l null

map ctrl+shift+j previous_tab
map ctrl+shift+k next_tab

font_size 9.0

# BEGIN_KITTY_FONTS
font_family      Fira Code Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Remote control for scripts (e.g. vpws) via $KITTY_LISTEN_ON
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# Tab bar — matches starship "yum" palette
tab_bar_edge             bottom
tab_bar_style            powerline
tab_powerline_style      angled
tab_title_template       " {index}: {title} "
active_tab_foreground    #0a0c23
active_tab_background    #57b2eb
active_tab_font_style    bold
inactive_tab_foreground  #b7b6d6
inactive_tab_background  #2f4083
inactive_tab_font_style  normal
