--password-store=basic
--ozone-platform-hint=auto
--enable-features=WebRTCPipeWireCapturer

# If Brave crashes on startup with "Trace/breakpoint trap (core dumped)":
# its native Wayland backend is failing against the running compositor.
# Comment out the hint line above and uncomment this one (the *hint* form
# does NOT work -- only the authoritative flag does). A reboot usually fixes it.
#--ozone-platform=x11
